<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Lens | ألعاب أبو داحم</title>
<meta name="description" content="ألعاب أبو داحم: الخيميائي، توب 10، RANK S، تحدي الديوانية، درب الحروف ومسدس الروليت. كلها مجانية وتنزل من لانشر Red Lens.">

<meta property="og:description" content="كل لعبة بدأت بفكرة. ست ألعاب مجانية للكمبيوتر في لانشر واحد.">

<style>
@font-face{font-family:Readex;src:url(assets/fonts/readex-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Readex;src:url(assets/fonts/readex-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Readex;src:url(assets/fonts/readex-700.woff2) format("woff2");font-weight:700;font-display:swap}

/* One dark theme: the page is a game's main menu. --accent follows the selected game. */
:root{
  --bg:#08080c; --text:#f3f1ec; --muted:#a3a1ad; --dim:#6d6b78; --line:rgba(255,255,255,.14);
  --accent:#3fd6c6; --ink:#08080c;
  --kufi:"Reem Kufi",Readex,"Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.75 Readex,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* dark backdrop tinted with the selected game's colour, with the interactive dot field on top */
.stage{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 38% 42%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%),var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* menu layout */
.ui{position:relative;z-index:1;height:100dvh;display:grid;grid-template-columns:minmax(270px,23%) 1fr;column-gap:clamp(24px,3vw,48px);grid-template-rows:auto 1fr auto;padding:clamp(24px,4vw,56px)}
.head{grid-column:1;grid-row:1}
.games{grid-column:1;grid-row:2;align-self:center}
.who{font-weight:700;font-size:1.15rem;line-height:1;display:flex;align-items:center;gap:12px}
.who span{direction:ltr;letter-spacing:.14em;font-size:1.05rem}
.who b{color:#ff2a35;font-weight:700}
.who img{width:52px;height:52px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.line{color:var(--muted);margin-top:10px;font-size:.98rem}

.menu{list-style:none;padding:0;display:grid;gap:4px}
.menu button{word-spacing:.3em;position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:6px 0;
  font:700 clamp(1.7rem,3vw,2.55rem)/1.25 var(--kufi);color:var(--dim);transition:color .25s,transform .45s var(--ease)}
.menu button::before{content:"";flex:none;width:10px;height:10px;background:var(--accent);transform:rotate(45deg) scale(0);transition:transform .35s var(--ease)}
.menu button[aria-current="true"]{color:var(--text);transform:translateX(-10px)}
.menu button[aria-current="true"]::before{transform:rotate(45deg) scale(1)}
.menu button:hover{color:var(--text)}
.menu small{font:600 .72rem/1 Readex,sans-serif;color:var(--ink);background:var(--accent);padding:5px 8px 4px;border-radius:3px}

.foot{grid-column:1/-1;grid-row:3;display:flex;gap:26px;white-space:nowrap;padding-top:16px;align-items:center;color:var(--muted);font-size:.95rem}
.foot a,.foot button{border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.foot a:hover,.foot button:hover{color:var(--text);border-color:var(--accent)}
.social{display:flex;gap:10px;margin-inline-start:auto}
.social a{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:4px;background:rgba(8,8,12,.5);transition:border-color .2s,transform .2s}
.social a:hover{transform:translateY(-2px);filter:brightness(1.2)}
.social img{width:18px;height:18px}
#sound[aria-pressed="false"]{color:var(--dim);text-decoration:line-through}
.count{color:var(--muted);font-size:.88rem;margin-top:8px}
.count b{color:var(--accent);font-size:1rem}

/* info about the selected game */
.show{grid-column:2;grid-row:1/3;align-self:center;width:100%;max-width:min(1600px,calc((100dvh - 250px) * 16 / 9));justify-self:center}
.pic{aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000;box-shadow:0 30px 80px -30px #000,0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.pic img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .35s ease}
/* text on one side, buttons on the other, so the picture keeps most of the height */
.info{margin-top:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px 40px;align-items:start}
.info .act{margin-top:0}
.info .note{max-width:44ch}
.info > *{animation:in .55s var(--ease) both}
.info > :nth-child(2){animation-delay:.05s}.info > :nth-child(3){animation-delay:.1s}.info > :nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:.8rem;border:1px solid var(--line);padding:2px 10px;border-radius:3px;background:rgba(8,8,12,.45)}
.tagline{font:700 1.45rem/1.45 var(--kufi);margin-top:8px;color:var(--accent);text-wrap:balance}
.about{color:#cfcdd6;margin-top:8px;text-wrap:pretty}
.act{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;padding:12px 20px;border-radius:4px;font-weight:700;border:1px solid var(--line);background:rgba(8,8,12,.5);transition:transform .2s,background .3s,border-color .3s}
.btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn kbd{font:600 .7rem/1 Readex,sans-serif;border:1px solid currentColor;border-radius:3px;padding:3px 5px;opacity:.65}
.note{color:var(--dim);font-size:.8rem;margin-top:12px}
.keys{color:var(--dim);font-size:.82rem;margin-top:18px}
.keys kbd{font:600 .72rem/1 Readex,sans-serif;border:1px solid var(--line);border-radius:3px;padding:3px 6px;margin-inline-end:4px;color:var(--muted)}

/* «اقترح لعبتك» */
dialog{margin:auto;width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:6px;padding:clamp(22px,4vw,34px);background:#101017;color:var(--text)}
dialog::backdrop{background:rgba(4,4,8,.75);backdrop-filter:blur(6px)}
dialog[open]{animation:in .4s var(--ease)}
dialog h2{font:700 1.8rem/1.3 var(--kufi)}
dialog > p{color:var(--muted);margin-top:6px}
#how h3{font:700 1.1rem/1.4 var(--kufi);color:var(--accent);margin-top:22px}
#how ol{list-style:none;padding:0;margin-top:12px;display:grid;gap:12px;counter-reset:step}
#how li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;line-height:1.7}
#how li::before{content:counter(step);display:grid;place-items:center;width:30px;height:30px;border-radius:4px;background:var(--accent);color:var(--ink);font-weight:700;font-size:.9rem}
.x{position:absolute;inset-inline-end:14px;top:12px;font-size:1.6rem;line-height:1;color:var(--muted);padding:6px}
.x:hover{color:var(--text)}
form{display:grid;gap:16px;margin-top:22px}
label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
label small{font-weight:400;color:var(--dim)}
input,textarea{font:inherit;font-weight:400;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:11px 14px;width:100%}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
::placeholder{color:#75737f}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .btn{justify-self:start}
form .btn[disabled]{opacity:.6}
output{font-weight:600;min-height:1.6em}
output.ok{color:#5fbf6a}
output.bad{color:#ff8a7a}

@media (max-width:860px){
  body{overflow:auto}
  .ui{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto;padding:20px 16px 32px;gap:22px}
  .head,.games,.foot,.show{grid-column:1;grid-row:auto}
  .show{order:2;max-width:none}
  .info{grid-template-columns:1fr}
  .info .act{margin-top:6px}
  .games{order:3}
  .foot{order:4;flex-wrap:wrap}
  .menu button[aria-current="true"]{transform:none}
  .keys,.btn kbd{display:none}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>

<script>
// Background: soft clouds of light in the selected game's colour under a field of dots. The clouds drift
// slowly and lean away from the pointer, dots near it swell and light up, and a click sends a ring of light out.
(() => {
  const cv = document.getElementById('field'), g = cv.getContext('2d');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GAP = 24, REACH = 230;
  const P = { x: -1e4, y: -1e4, sx: 0, sy: 0 };
  let W = 0, H = 0, dots = [], rings = [], t = 0, col = [63, 214, 198], want = col;
  const hex = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16));
  const rgba = (c, a) => `rgba(${c.map(Math.round).join(',')},${a})`;
  window.setFieldColour = h => { want = hex(h); if (calm) draw(); };

  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = [];
    for (let y = GAP / 2; y < H; y += GAP) for (let x = GAP / 2; x < W; x += GAP) dots.push({ x, y, l: 0 });
    if (calm) draw();
  }

  function cloud(x, y, r, c, a) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }

  function draw() {
    t += 1 / 60;
    col = col.map((c, k) => c + (want[k] - c) * .05);
    const deep = col.map((c, k) => c * .45 + [70, 40, 140][k] * .55); // the accent pulled toward violet for depth
    // the clouds lean a little away from the pointer, so the picture feels like it has depth
    const tx = P.x > -1e3 ? (P.x / W - .5) : 0, ty = P.y > -1e3 ? (P.y / H - .5) : 0;
    P.sx += (tx - P.sx) * .04; P.sy += (ty - P.sy) * .04;
    g.clearRect(0, 0, W, H);
    const m = Math.max(W, H);
    cloud(W * (.22 + .06 * Math.sin(t * .13)) - P.sx * 60, H * (.3 + .05 * Math.cos(t * .11)) - P.sy * 40, m * .55, col, .22);
    cloud(W * (.78 + .05 * Math.cos(t * .09)) - P.sx * 90, H * (.78 + .06 * Math.sin(t * .12)) - P.sy * 60, m * .5, deep, .3);
    cloud(W * (.55 + .08 * Math.sin(t * .07 + 2)) - P.sx * 30, H * (.12 + .04 * Math.sin(t * .1)) - P.sy * 20, m * .35, col, .12);

    rings = rings.filter(o => (o.r += 10) < 1000);
    for (const d of dots) {
      const dx = d.x - P.x, dy = d.y - P.y, dist = Math.hypot(dx, dy);
      const near = dist < REACH ? 1 - dist / REACH : 0;
      const wave = .5 + .5 * Math.sin(d.x * .006 + d.y * .004 - t * .9);
      let ring = 0;
      for (const o of rings) ring = Math.max(ring, Math.max(0, 1 - Math.abs(Math.hypot(d.x - o.x, d.y - o.y) - o.r) / 46) * (1 - o.r / 1000));
      d.l += (Math.min(1, near * near * 1.3 + ring) - d.l) * .2;
      const push = near * 12;
      const x = d.x + (dist > .1 ? dx / dist * push : 0), y = d.y + (dist > .1 ? dy / dist * push : 0);
      const s = 1.6 + d.l * 3.4;
      g.fillStyle = rgba(d.l > .05 ? col.map(c => c + (255 - c) * d.l * .35) : col, .1 + wave * .14 + d.l * .85);
      g.fillRect(x - s / 2, y - s / 2, s, s);
    }
    if (P.x > -1e3) cloud(P.x, P.y, 180, col, .1); // soft light under the pointer
    if (!calm) requestAnimationFrame(draw);
  }

  size();
  addEventListener('resize', size);
  if (calm) return;
  addEventListener('pointermove', e => { P.x = e.clientX; P.y = e.clientY; });
  document.documentElement.addEventListener('pointerleave', () => { P.x = P.y = -1e4; });
  addEventListener('pointerdown', e => { if (!e.target.closest('a,button,input,textarea,dialog')) rings.push({ x: e.clientX, y: e.clientY, r: 0 }); });
  requestAnimationFrame(draw);
})();

const LAUNCHER = 'https://github.com/Abdalruhman7/vibe-games/releases/download/games/RedLens.exe';
// his accounts: a button shows only when its link is filled in
const SOCIAL = [
  { name: 'تيك توك', icon: 'tiktok', c: '5fc9c6', url: 'https://www.tiktok.com/@abuda4em' },
  { name: 'ديسكورد', icon: 'discord', c: '8a93f0', url: 'https://discord.gg/q2GryKeZXU' },
  { name: 'تويتش', icon: 'twitch', c: 'a985f0', url: 'https://www.twitch.tv/mattdock_' },
];
document.getElementById('social').innerHTML = SOCIAL.filter(a => a.url).map(a =>
  `<a href="${a.url}" target="_blank" rel="noopener" aria-label="${a.name}" title="${a.name}" style="border-color:#${a.c}55"><img src="https://cdn.simpleicons.org/${a.icon}/${a.c}" alt="" width="18" height="18"></a>`).join('');

// soft menu sounds made in the browser (no files); the switch in the footer is remembered
const mem = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let soundOn = mem.get('sound') !== 'off', actx;
const soundBtn = document.getElementById('sound');
soundBtn.setAttribute('aria-pressed', soundOn);
soundBtn.onclick = () => { soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', soundOn); mem.set('sound', soundOn ? 'on' : 'off'); if (soundOn) blip(660, .07); };
function blip(freq, len, type = 'sine', vol = .05) {
  if (!soundOn) return;
  actx ??= new (window.AudioContext || window.webkitAudioContext)();
  const o = actx.createOscillator(), v = actx.createGain(), t0 = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t0 + len);
  v.gain.setValueAtTime(vol, t0); v.gain.exponentialRampToValueAtTime(.0001, t0 + len);
  o.connect(v); v.connect(actx.destination); o.start(t0); o.stop(t0 + len);
}

// counts: launcher installs come from GitHub's download numbers, browser plays from a small public counter
// shortcut: abacus.jasoncameron.dev is a free counter with no uptime promise; move to his own backend if it ever fails
const ABACUS = 'https://abacus.jasoncameron.dev', SHOW_FROM = 10; // tiny numbers are hidden until they grow
const CATALOG_ID = { alchemist: 'alchemist', 'rank-s': 'rank-s', diwaniya: 'diwaniya-quiz', top10: 'top10', darb: 'darb-al-huruf', roulette: 'russian-roulette' };
const COUNTS = {};
const countHtml = g => {
  const c = COUNTS[g.id] || {};
  const bits = [];
  if (c.plays >= SHOW_FROM) bits.push(`انلعبت <b>${c.plays.toLocaleString('ar')}</b> مرة`);
  if (c.dl >= SHOW_FROM) bits.push(`نزّلوها <b>${c.dl.toLocaleString('ar')}</b> مرة`);
  return bits.join(' · ');
};
const playHit = id => fetch(`${ABACUS}/hit/abudahem-games/play-${id}`, { keepalive: true }).catch(() => {});
// Text follows the launcher catalog (D:\GameLauncher\dist\catalog.json); edit both together.
const GAMES = [
  { id: 'alchemist', how: ["اختار شخصيتك من خمس: الحارس، الرامي، المداوي، الشبح، أو العاصف. واختار عنصرك: نار، ثلج، برق، سم، رياح، أو أرض.", "تنزل ساحة فوق النجوم وتجيك موجات وحوش. اضرب الوحش بعنصر وبعده بعنصر ثاني ويصير تفاعل، مثل العاصفة الثلجية والحمم.", "بعد كل جولة اختار غرض من ثلاثة. الأغراض تتراكم وتقويك أكثر وأكثر.", "إذا طحت ربعك يقومونك، وإذا طحتوا كلكم تنتهي الجولة.", "تلعبها بروحك أو مع ربعك لين 4 لاعبين: واحد يستضيف والباقين يدخلون عنده. المستضيف يفتح المنفذ 7777 UDP بالراوتر."],
    name: 'الخيميائي', accent: '#3fd6c6', badge: 'تجريبية',
    tags: ['أونلاين', 'روغلايك', 'لين 4 لاعبين'],
    tagline: 'امزج العناصر مع ربعك',
    about: 'خمس شخصيات وستة عناصر، وكل عنصرين يصنعون تفاعل مثل العاصفة الثلجية والحمم. موجات وحوش بساحة فوق النجوم.' },

const menu = document.getElementById('menu'), info = document.getElementById('info');
const pic = document.getElementById('pic');
const PICS = 4; // bump when the pictures change, so browsers stop showing the old ones
let cur = -1;

menu.innerHTML = GAMES.map((g, i) =>
  `<li><button type="button" data-i="${i}">${g.name}${g.badge ? ` <small>${g.badge}</small>` : ''}</button></li>`).join('');
const items = [...menu.querySelectorAll('button')];

function show(i) {
  if (i === cur) return;
  const g = GAMES[cur = i];
  document.documentElement.style.setProperty('--accent', g.accent);
  window.setFieldColour?.(g.accent);
  items.forEach((b, k) => b.setAttribute('aria-current', k === i));
  pic.style.opacity = 0;
  pic.onload = () => { pic.style.opacity = 1; };
  pic.src = `assets/shots/${g.id}.webp?v=${PICS}`;
  pic.alt = `الشاشة الرئيسية للعبة ${g.name}`;
  info.innerHTML = `
    <div>
      <div class="tags">${g.tags.map(t => `<span>${t}</span>`).join('')}</div>
      <p class="tagline">${g.tagline}</p>
      <p class="about">${g.about}</p>
      <p class="count" id="count">${countHtml(g)}</p>
    </div>
    <div>
      <div class="act">
        <a class="btn go" href="${LAUNCHER}" download>حمّل اللانشر <kbd>Enter</kbd></a>
        ${g.play ? `<a class="btn" href="${g.play}">العبها الحين</a>` : ''}
        <button class="btn" type="button" id="how-open">شرح اللعبة</button>
      </div>
      <p class="note">ويندوز ممكن يطلّع تنبيه أول مرة: اضغط «مزيد من المعلومات» ثم «تشغيل على أي حال».</p>
      <p class="keys"><kbd>↑</kbd><kbd>↓</kbd>تنقّل بين الألعاب</p>
    </div>`;
  info.querySelector('.act a:not(.go)')?.addEventListener('click', () => playHit(g.id));
  info.querySelector('.go').addEventListener('click', () => blip(520, .25, 'triangle', .06));
  document.getElementById('how-open').onclick = () => {
    how.querySelector('h2').textContent = g.name;
    how.querySelector('.what').textContent = g.about;
    how.querySelector('ol').innerHTML = g.how.map(t => `<li>${t}</li>`).join('');
    how.showModal();
  };
}

// a game changes only when its name is clicked (or reached with the arrow keys), never on hover
items.forEach((b, i) => {
  b.addEventListener('click', () => show(i));
  b.addEventListener('focus', () => { if (cur !== i) blip(420 + i * 70, .09); show(i); });
});

const idea = document.getElementById('idea'), how = document.getElementById('how');
how.addEventListener('click', e => { if (e.target === how || e.target.closest('[data-close]')) how.close(); });
addEventListener('keydown', e => {
  if (idea.open || how.open || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    items[(cur + (e.key === 'ArrowDown' ? 1 : -1) + GAMES.length) % GAMES.length].focus();
  } else if (e.key === 'Enter' && !e.target.closest('a,button')) {
    info.querySelector('.go').click();
  }
});

show(0);

(async () => {
  const put = () => { const el = document.getElementById('count'); if (el) el.innerHTML = countHtml(GAMES[cur]); };
  try {
    const r = await fetch('https://api.github.com/repos/Abdalruhman7/vibe-games/releases/tags/games');
    const assets = (await r.json()).assets || [];
    for (const g of GAMES) {
      const id = CATALOG_ID[g.id];
      // a game split into parts counts once: only its first part
      const mine = assets.filter(a => new RegExp(`^${id}-[0-9.]+(-1)?\\.(zip|bin)$`).test(a.name));
      (COUNTS[g.id] ??= {}).dl = mine.reduce((n, a) => n + a.download_count, 0);
    }
  } catch {}
  put();
  await Promise.all(GAMES.filter(g => g.play).map(async g => {
    try { (COUNTS[g.id] ??= {}).plays = (await (await fetch(`${ABACUS}/get/abudahem-games/play-${g.id}`)).json()).value || 0; } catch {}
  }));
  put();
})();

// «اقترح لعبتك» goes straight into the owner's Google Form (answers land in his sheet).
// Fill these from the form: its formResponse address and the entry.NNN id of each question.
const FORM = { url: '', idea: '', name: '', contact: '' };
document.getElementById('idea-open').addEventListener('click', () => idea.showModal());
idea.addEventListener('click', e => { if (e.target === idea || e.target.closest('[data-close]')) idea.close(); });
const form = document.getElementById('idea-form');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const out = form.querySelector('output'), btn = form.querySelector('button[type=submit]');
  const say = (text, cls) => { out.textContent = text; out.className = cls; };
  const f = form.elements, text = f.idea.value.trim();
  if (text.length < 10) { say('اكتب فكرتك أول، ولو بسطر.', 'bad'); f.idea.focus(); return; }
  if (!FORM.url) { say('الإرسال لسا ما انربط. جرّب بعدين.', 'bad'); return; }
  const data = new URLSearchParams({ [FORM.idea]: text, [FORM.name]: f.name.value.trim(), [FORM.contact]: f.contact.value.trim() });
  btn.disabled = true; say('جاري الإرسال...', '');
  try {
    // no-cors: Google gives no readable reply, so only a network failure counts as an error
    await fetch(FORM.url, { method: 'POST', mode: 'no-cors', body: data });
    form.reset(); say('وصلت فكرتك. مشكور!', 'ok');
  } catch { say('ما انرسلت. تأكد من النت وجرّب مرة ثانية.', 'bad'); }
  btn.disabled = false;
});
</script>
