<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>توب 10</title>
<style>
:root{--bg:#0B0C14;--panel:#171A29;--slot:#12141F;--line:#2A2E44;--ink:#F4F1EA;--mute:#8E92A8;--red:#FF2A35;--red2:#FF5C61;--gold:#FFC857;--glow:rgba(255,42,53,.18)}
:root.light{--bg:#F4F1EA;--panel:#FFFFFF;--slot:#ECE8DF;--line:#DAD5CA;--ink:#14151F;--mute:#6E6F80;--red:#E0141F;--red2:#E0141F;--gold:#C98A00;--glow:rgba(224,20,31,.10)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:780px;margin:0 auto;padding:22px 16px 40px}
header{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.lens{width:64px;height:64px;border-radius:50%;border:4px solid var(--red);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--ink);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--line),0 0 24px var(--glow);position:relative}
.lens:after{content:"";position:absolute;top:9px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--red)}
h1{margin:0;font-size:40px;font-weight:900;line-height:1}
.brand{display:block;font-size:11px;letter-spacing:4px;color:var(--red);font-weight:800;margin-bottom:6px;direction:ltr;text-align:right}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.tools{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.tools button{background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:17px;cursor:pointer;width:36px;height:36px;border-radius:10px}
.tools button:hover{color:var(--ink);border-color:var(--red)}
.q{background:var(--panel);border:1px solid var(--line);border-right:5px solid var(--red);border-radius:6px 14px 14px 6px;padding:16px 22px;font-size:23px;font-weight:800;line-height:1.5}
.qn{display:block;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--red2);margin-bottom:4px}
form{display:flex;gap:10px;margin-top:14px}
input{flex:1;background:var(--slot);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:18px;padding:12px 16px;outline:0;min-width:0}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--glow)}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:0 26px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;min-height:48px}
.btn:hover{background:var(--red2)}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 2px 6px}
.score{font-size:15px;color:var(--mute);font-weight:700}
.score b{font-size:28px;color:var(--ink);margin-left:4px}
.lives{display:flex;align-items:center;gap:6px;color:var(--mute);font-weight:700;font-size:13px}
.lives em{width:16px;height:16px;border-radius:50%;border:3px solid var(--red);box-shadow:0 0 8px var(--glow)}
.lives em.x{border-color:var(--line);box-shadow:none;position:relative}
.lives em.x:after{content:"";position:absolute;inset:-3px;background:linear-gradient(45deg,transparent 45%,var(--mute) 45% 55%,transparent 55%)}
.pill{height:34px;display:flex;justify-content:center;align-items:center;margin-bottom:8px}
.pill span{border-radius:8px;padding:4px 14px;font-size:15px;font-weight:700;animation:pop .25s;background:rgba(255,200,87,.14);color:var(--gold);border:1px solid rgba(255,200,87,.35)}
.pill span.bad{background:var(--glow);color:var(--red2);border-color:var(--red)}
.pill span.near{background:rgba(255,140,40,.15);color:#FF9A3D;border-color:#FF8A2A;animation:pop .25s,pulse 1s .25s}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(255,140,40,.5)}}
.pill span.info{background:var(--panel);color:var(--ink);border-color:var(--line)}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,auto);gap:10px 14px;counter-reset:r}
.slot{--cut:14px;position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px 0 12px;font-size:17px;font-weight:700;overflow:hidden;
  background:linear-gradient(100deg,rgba(255,255,255,.035),transparent 60%),var(--slot);border:1px solid var(--line);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:transform .15s,border-color .2s}
.slot:hover{transform:translateX(-3px);border-color:rgba(255,42,53,.5)}
.slot .n{flex:none;width:38px;font-size:30px;font-weight:900;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:transparent;-webkit-text-stroke:1.5px var(--line)}
.slot .t{flex:1;height:10px;border-radius:5px;max-width:62%;font-size:0;background:linear-gradient(90deg,var(--line) 0 40%,rgba(255,42,53,.45) 50%,var(--line) 60% 100%) 0 0/300% 100%;animation:scan 2.6s linear infinite;opacity:.7}
@keyframes scan{to{background-position:-300% 0}}
.slot .e{flex:none;display:flex;gap:10px;color:var(--mute);font-size:14px;z-index:1}
.slot .e button{background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:0}
.slot .e .ok{color:var(--gold);font-weight:900}
.slot.got{background:linear-gradient(270deg,rgba(255,200,87,.16),transparent 55%),var(--panel);border-color:rgba(255,200,87,.55);box-shadow:inset -4px 0 0 var(--gold),0 0 22px rgba(255,200,87,.12);animation:hit .5s ease-out}
.slot.got:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(120%);animation:shine .9s .1s ease-out}
.slot.got .n{color:var(--gold);-webkit-text-stroke:0;text-shadow:0 0 14px rgba(255,200,87,.6)}
.slot.got .t,.slot.miss .t{height:auto;background:none;max-width:none;opacity:1;animation:none;font-size:17px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.miss{background:linear-gradient(270deg,rgba(255,42,53,.14),transparent 55%),var(--slot);box-shadow:inset -4px 0 0 var(--red)}
.slot.miss .n{color:var(--red);-webkit-text-stroke:0}
.slot.miss .t{color:var(--mute)}
.slot.flash{border-color:var(--gold);animation:shake .35s}
@keyframes hit{0%{transform:scale(.94);filter:brightness(2)}60%{transform:scale(1.02)}}
@keyframes shine{to{transform:translateX(-120%)}}
@keyframes shake{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
body:before,body:after{content:"";position:fixed;z-index:-2;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.22;pointer-events:none}
body:before{background:var(--red);top:-30vmax;right:-20vmax;animation:drift 18s ease-in-out infinite alternate}
body:after{background:#7a1cff;bottom:-35vmax;left:-25vmax;opacity:.14;animation:drift 24s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-12vmax,10vmax) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
:root.light .grain{display:none}
@media (prefers-reduced-motion:reduce){*,body:before,body:after{animation:none!important}}
.done{text-align:center;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:34px 22px;margin-top:10px;animation:pop .4s}
.done .trophy{font-size:64px;filter:drop-shadow(0 0 18px rgba(255,200,87,.5))}
.done h2{margin:8px 0;font-size:30px;color:var(--gold)}
.done p{color:var(--mute);font-size:18px;line-height:1.8;margin:0 0 18px}
.done p b{color:var(--red2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mute);font-size:15px;padding:0 18px}
.btn.ghost:hover{color:var(--ink);border-color:var(--red)}
.end{text-align:center;margin-top:20px}
.end p{font-size:20px;font-weight:800;margin:0 0 12px}
@media (max-width:560px){h1{font-size:32px}.lens{width:52px;height:52px;font-size:24px}.tools{position:static;transform:none}header{flex-wrap:wrap}.q{font-size:19px}.grid{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}
</style>
</head>

// Arabic/English folding so spelling variants (أ/ا، ة/ه، ى/ي، spaces, ال) still match
const norm=s=>s.toLowerCase().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[ً-ٟـ']/g,"")
  .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
  .replace(/^(سوره|جزيره|بحيره|جبل|لعبه|دوله|the) /,"").replace(/[^a-z0-9ء-ي]/g,"");
const forms=s=>{const n=norm(s);return n.startsWith("ال")&&n.length>4?[n,n.slice(2)]:[n]};
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]!==b[j-1]));p=c}return p[b.length]};
const digits=s=>s.replace(/\D/g,"");
// Every spelling of every answer in the whole bank. A guess that IS some other real thing (هوندا, تشيلي)
// must not be accepted as a look-alike answer (هولندا, تشيلسي) by the typo allowance.
const ansForms=a=>new Set([a[0],...a.slice(2)].flatMap(x=>forms(String(x))));
const KNOWN=new Map();Q.forEach(q=>q.a.forEach(a=>ansForms(a).forEach(f=>{if(!KNOWN.has(f))KNOWN.set(f,[]);KNOWN.get(f).push(a)})));
// answers allowed for a fuzzy hit: all, or (if the guess names a known thing) only the same thing spelled differently
function fuzzyOk(guess){
  const known=forms(guess).flatMap(f=>KNOWN.get(f)||[]);if(!known.length)return ()=>true;
  const same=new Set(known.flatMap(a=>[...ansForms(a)]));
  return ans=>[...ansForms(ans)].some(f=>same.has(f));
}

function match(q,guess){
  const g=forms(guess);if(!g[0])return -1;let best=-1,bd=9;const ok=fuzzyOk(guess);
  q.a.forEach((ans,i)=>[ans[0],...ans.slice(2)].forEach(alias=>forms(String(alias)).forEach(f=>g.forEach(x=>{
    if(x===f){bd=-1;best=i;return}
    const tol=f.length>=9?2:f.length>=5?1:0; // short names (symbols, طه) must be exact
    // typos: same first letter, at most one letter longer/shorter (so "ماريو كارت DS" is not "ماريو كارت")
    if(bd>=0&&digits(x)===digits(f)&&x[0]===f[0]&&Math.abs(x.length-f.length)<=1&&ok(ans)){const d=lev(x,f);if(d<=tol&&d<bd){bd=d;best=i}}
  }))));
  return best;
}

function near(q,guess){
  const g=forms(guess);if(norm(guess).length<3)return -1;let best=-1,bd=99;const ok=fuzzyOk(guess);
  q.a.forEach((ans,i)=>ok(ans)&&[ans[0],...ans.slice(2)].forEach(alias=>forms(String(alias)).forEach(f=>g.forEach(x=>{
    if(digits(x)!==digits(f)||f.length<3)return; // PS3 is not "near" PS2: a different thing
    // one letter past what counts, same first letter (so فرنسا is not "near" روسيا), or the start of the name
    const d=lev(x,f),lim=(f.length>=9?2:f.length>=5?1:0)+1;
    if(d<=lim&&d<bd&&x[0]===f[0]){bd=d;best=i}
    else if(bd>0&&x.length>=4&&(f.startsWith(x)||x.startsWith(f))){bd=0;best=i}
  }))));

}

}
function draw(){
  $("found").innerHTML=`<b>${found.size}</b>/ 10 وجدتها`;
  $("lives").innerHTML="المحاولات "+Array.from({length:LIVES},(_,i)=>`<em class="${i<wrong?"x":""}"></em>`).join("");
}
function reveal(i,cls){
  const a=Q[qi].a[i],s=$("s"+i);s.className="slot "+cls;s.querySelector(".t").textContent=a[0];
  s.querySelector(".e").innerHTML=`<button title="معلومة" data-i="${i}">👁</button>`+(cls==="got"?`<span class="ok">✓</span>`:"");
}
// light synth sounds, no files: Web Audio tones made on the spot
let ac,muted=false;try{muted=localStorage.top10mute==="1"}catch(e){}
function tone(f,t0,d,type="sine",v=.12,f2){
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const SFX={
  ok:()=>{tone(660,0,.12,"triangle");tone(990,.08,.22,"triangle")},
  bad:()=>tone(190,0,.28,"sawtooth",.06,110),
  near:()=>{tone(520,0,.08,"sine",.09);tone(620,.1,.1,"sine",.09)},
  dup:()=>tone(440,0,.08,"sine",.06),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.11)),
  lose:()=>[392,330,262].forEach((f,i)=>tone(f,i*.16,.35,"triangle",.09)),
  next:()=>tone(300,0,.18,"sine",.07,600)
};
function sfx(k){if(!muted)try{SFX[k]()}catch(e){}}
function pill(text,cls=""){$("pill").innerHTML=`<span class="${cls}">${text}</span>`}
$("f").onsubmit=e=>{
  e.preventDefault();if(over)return;const v=$("in").value.trim();if(!norm(v))return;$("in").value="";
  let i=match(Q[qi],v);
  if(i>=0&&found.has(i)){pill("جبتها قبل!","info");sfx("dup");const s=$("s"+i);s.classList.add("flash");setTimeout(()=>s.classList.remove("flash"),700)}
  else if(i>=0){found.add(i);reveal(i,"got");pill("إجابة صحيحة ✓");sfx("ok")}
  else if(tried.has(norm(v))){pill("جربتها قبل!","info");sfx("dup")}
  else if((i=near(Q[qi],v))>=0){pill(found.has(i)?"جبتها قبل!":"قربت! 🔥 شيك على الكتابة","near");sfx(found.has(i)?"dup":"near")}
  else{tried.add(norm(v));wrong++;pill("إجابة خاطئة ✗","bad");if(wrong<LIVES)sfx("bad")}
  draw();
  if(found.size===10)finish(true);else if(wrong>=LIVES)finish(false);
};
function finish(win){
  over=true;sfx(win?"win":"lose");Q[qi].a.forEach((_,i)=>found.has(i)||reveal(i,"miss"));
  $("f").hidden=true;$("end").hidden=false;$("endt").textContent=win?"كفو! جبت العشرة كلهم 🏆":`انتهت محاولاتك — جبت ${found.size} من 10`;$("next").focus();
}
$("grid").onclick=e=>{const b=e.target.closest("button[data-i]");if(b){const a=Q[qi].a[b.dataset.i];pill(`${a[0]}: ${a[1]}`,"info")}};
$("next").onclick=()=>{sfx("next");start()};
const sndIcon=()=>$("snd").textContent=muted?"🔇":"🔊";sndIcon();
$("snd").onclick=()=>{muted=!muted;sndIcon();try{localStorage.top10mute=muted?"1":"0"}catch(e){}sfx("dup")};
$("again").onclick=()=>{seen.clear();try{localStorage.top10seen="[]"}catch(e){}start()};
$("reset").onclick=start;
$("theme").onclick=()=>{const l=document.documentElement.classList.toggle("light");try{localStorage.top10light=l?"1":"0"}catch(e){}};
start();
(()=>{const c=$("fx"),x=c.getContext("2d");let W,H,P=[];
const size=()=>{W=c.width=innerWidth;H=c.height=innerHeight};size();addEventListener("resize",size);
const spawn=y=>({x:Math.random()*W,y:y??H+10,r:Math.random()*2+.6,v:Math.random()*.5+.2,s:Math.random()*Math.PI*2,g:Math.random()<.25});
for(let i=0;i<70;i++)P.push(spawn(Math.random()*H));
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
(function tick(){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;p.s+=.02;p.x+=Math.sin(p.s)*.3;if(p.y<-10)Object.assign(p,spawn());
  const a=Math.min(1,p.y/H)*.8;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=p.g?`rgba(255,200,87,${a})`:`rgba(255,60,70,${a})`;x.shadowBlur=8;x.shadowColor=x.fillStyle;x.fill()}
  requestAnimationFrame(tick)})()})();
</script>
