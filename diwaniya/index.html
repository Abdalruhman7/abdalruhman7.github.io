<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحدي الديوانية | أبو داحم</title>
<style>
@font-face{font-family:Readex;src:url(../assets/fonts/readex-700.woff2) format("woff2");font-weight:700;font-display:swap}
html,body{height:100%;margin:0;background:#0c0a14;color:#f4f1ea;font:700 18px/1.8 Readex,"Segoe UI",Tahoma,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#wait{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px;background:#0c0a14;transition:opacity .6s}
#wait.done{opacity:0;pointer-events:none}
#wait h1{font-size:clamp(2rem,7vw,3.2rem);margin:0;color:#ffc857}
#wait p{margin:0;color:#aca8bd;font-size:.95rem}
.bar{width:min(320px,70vw);height:6px;border-radius:6px;overflow:hidden;background:#2a2540}
.bar i{display:block;width:40%;height:100%;border-radius:6px;background:#ffc857;animation:run 1.3s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-150%)}}
a{color:#aca8bd;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<!-- shortcut: the game is one 65 MB protected file, so there is no percent, only a waiting screen; split the pictures out of it if the wait proves too long -->
<iframe src="game.html" title="تحدي الديوانية" allow="fullscreen" onload="document.getElementById('wait').classList.add('done')"></iframe>
<div id="wait" role="status">
  <h1>تحدي الديوانية</h1>
  <div class="bar"><i></i></div>
  <p>اللعبة تتحمّل. أول مرة تاخذ شوي لأن حجمها 65 ميغا.</p>
  <a href="../">رجوع للموقع</a>
</div>
</body>
</html>
